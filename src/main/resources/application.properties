# ==================== 服务配置 ====================
server.port=${PORT:8080}   # 微信云托管会注入 PORT 环境变量（默认 80），本地无 PORT 时回落 8080

# ==================== 文件上传限制（录音文件） ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==================== 数据库配置 ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.38.134:3306/elderly_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== Redis配置（高频问答缓存，不可用时自动降级） ====================
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# ==================== MyBatis配置 ====================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.elderly.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== 百度语音SDK（支持环境变量覆盖，生产环境建议使用环境变量） ====================
# 从 https://console.bce.baidu.com/ai 获取
baidu.appId=${BAIDU_APP_ID:}
baidu.apiKey=${BAIDU_API_KEY:}
baidu.secretKey=${BAIDU_SECRET_KEY:}

# ==================== Chroma向量数据库 ====================
chroma.url=${CHROMA_URL:http://127.0.0.1:8001}
chroma.collection=elder_health_guide
# 反诈案例库：内容识别 → RAG 比对 → 风险等级（Agent3 反诈使用）
chroma.fraud.collection=elder_fraud_case

# ==================== 阿里云百炼大模型 ====================
# --- 必填：DashScope API Key（从百炼控制台获取，格式 sk-xxx） ---
# 获取地址：https://bailian.console.aliyun.com/ → 模型广场 → API-KEY管理
# 注意：这里必须填 DashScope 的 API Key，不是阿里云的 AccessKey Secret！
#       AccessKey Secret 无法直接调用通义千问，不要把两者搞混。
ai.aliyun.dashscope-api-key=${AI_ALIYUN_DASHSCOPE_API_KEY:}

# --- 模型参数 ---
# 模型名称：qwen-turbo（快速） / qwen-plus（均衡） / qwen-max（最强）
ai.aliyun.model=qwen-turbo
# 生成温度（0~1）：越高越随机有创意，越低越确定规范。养老服务场景建议 0.5~0.8
ai.aliyun.temperature=0.7
# Top-P 采样（0~1）：nucleus sampling，控制生成多样性。建议 0.8~0.9
ai.aliyun.top-p=0.9
# 最大生成 token 数（0 表示不限制）
ai.aliyun.max-tokens=1024

# ==================== 本地Ollama（可选离线兜底） ====================
# 如需使用本地Ollama，取消下面两行注释并配置正确地址
#ai.local.base-url=http://127.0.0.1:11434/v1
#ai.local.model=qwen:1.8b

# ==================== Jackson序列化 ====================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# ==================== WebFlux请求超时 ====================
spring.webflux.server.request-timeout=60000

# ==================== 日志级别 ====================
logging.level.com.elderly=debug
logging.level.org.springframework.web=info

# ==================== CORS跨域配置 ====================
# 允许的来源，多个用逗号分隔；默认 * 兼容开发环境，生产环境请配置具体域名白名单
# 示例：cors.allowed-origins=https://your-domain.com,https://admin.your-domain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==================== 微信小程序订阅消息 ====================
# 在微信小程序后台（mp.weixin.qq.com）→ 开发 → 开发管理 → 开发设置 获取
# 模板 ID 在「功能」→「订阅消息」中申请，选择一次性订阅模板或长期订阅模板
wx.miniapp.app-id=${WX_APP_ID:}
wx.miniapp.app-secret=${WX_APP_SECRET:}
# 小程序版本状态：formal=正式版，trial=体验版，developer=开发版。当前用体验版测试，设为 trial
wx.miniapp.miniprogram-state=${WX_MINIPROGRAM_STATE:trial}
# 健康监测提醒订阅消息模板 ID（用于反诈风险检测通知）
# 模板名称：健康监测提醒；模板编号：33224；类目：健康管理；场景说明：反诈风险
# 字段映射：thing6=监测内容，thing12=风险等级，thing13=防护建议
wx.miniapp.template.fraud-risk=${WX_TEMPLATE_FRAUD_RISK:0vvSSZHv1zNmww0j-HSAnq5bWwQiqx1qo1Pxe0KXQP8}
# 健康检测通知订阅消息模板 ID（用于健康异常时通知家属）
# 模板名称：健康检测通知；模板编号：24543；类目：健康管理；场景说明：健康检测
# 字段映射：number1=血压高压，number2=血压低压，number3=心率，number9=血糖，number13=体温
wx.miniapp.template.health-abnormal=${WX_TEMPLATE_HEALTH_ABNORMAL:UG-xRGPTv3GDggJhGgYD1xWm7ulCxyQGpeaAFOF17_M}
# 可选：关怀日报订阅消息模板 ID（用于每日关怀推送）
# wx.miniapp.template.daily-care=${WX_TEMPLATE_DAILY_CARE:}
